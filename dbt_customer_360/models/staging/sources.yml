version: 2

sources:
  - name: bronze
    description: >
      Raw, untransformed landing zone loaded by the `load_s3_data_to_bronze`
      Airflow DAG. One table per source CSV, truncate-and-reload on every
      run, all columns stored as TEXT. Data here is deliberately "dirty" --
      malformed rows are reconciled (not dropped) on load, so staging
      models are responsible for all type casting, cleaning, and
      deduplication. Do not write to this schema from dbt.
    schema: bronze
    loader: airflow
    tables:
      - name: customers
        description: One row per customer, as generated by the synthetic data generator.

      - name: mobile_usage
        description: Mobile usage records per customer.

      - name: financial_transactions
        description: Financial transaction records per customer.

      - name: credit_accounts
        description: Credit account records per customer.

      - name: fiber_subscriptions
        description: Fiber subscription records per customer.

      - name: fiber_usage
        description: Fiber usage records per subscription.

      - name: device_purchases
        description: Device purchase records per customer.

      - name: enterprise_services
        description: Enterprise service records per customer.

      - name: digital_services
        description: Digital service records per customer.