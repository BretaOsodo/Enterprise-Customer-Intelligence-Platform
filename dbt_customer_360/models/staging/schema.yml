version: 2

models:
  - name: stg_customers
    config:
      contract:
        enforced: true

    columns:
      - name: customer_id
        data_type: text

      - name: first_name
        data_type: text

      - name: last_name
        data_type: text

      - name: full_name
        data_type: text

      - name: gender
        data_type: text

      - name: date_of_birth
        data_type: date

      - name: phone_number
        data_type: text

      - name: email
        data_type: text
        constraints:
          - type: not_null

      - name: county
        data_type: text

      - name: town
        data_type: text

      - name: customer_type
        data_type: text

      - name: registration_date
        data_type: date

      - name: customer_status
        data_type: text

      - name: created_at
        data_type: date

      - name: updated_at
        data_type: date

      - name: segment
        data_type: text