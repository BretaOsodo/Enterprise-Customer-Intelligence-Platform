name: "customer-360-platform"

on:
  push:
    branches: [breta,main]
  pull_request:
    branches: [breta, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: pip install -r requirements.txt

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker build
        uses: docker/setup-buildx-action@v4

      - name: Create placeholder .env for compose validation
        run: |
          cat <<EOF > .env
          FERNET_KEY=
          AIRFLOW_UID=50000
          DOCKER_CONTAINER=postgres-dbt
          DOCKER_IMAGE=my-postgres-image
          POSTGRES_SCHEMA=customer_360_platform
          POSTGRES_USER=postgres
          POSTGRES_DB=postgres
          POSTGRES_PASSWORD=postgres
          HOST_PORT=5432
          CONTAINER_PORT=5432
          PGADMIN_EMAIL=ci@example.com
          PGADMIN_PASSWORD=ci
          PGADMIN_PORT=5050
          AWS_ACCESS_KEY=ci
          AWS_SECRET_KEY=ci
          EOF

      - name: Build docker
        run: |
          docker compose up -d --build